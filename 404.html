<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Página não encontrada | Reginaldo Negocia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root { --petroleo: #0B1D2E; --petroleo-dark: #06121C; --ouro: #C9A84C; --ouro-light: #D4B76A; --text-primary: #F0F2F5; --text-secondary: rgba(240,242,245,0.65); --border: rgba(201,168,76,0.15); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; background: var(--petroleo); color: var(--text-primary); font-family: 'Inter', sans-serif; display: flex; flex-direction: column; }
    header { padding: 1.5rem 6%; border-bottom: 1px solid var(--border); }
    .logo { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 600; color: var(--ouro); text-decoration: none; }
    .logo span { color: var(--text-primary); font-weight: 400; }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 4rem 6%; }
    .box { max-width: 620px; text-align: center; }
    .eyebrow { font-size: 0.75rem; letter-spacing: 3px; text-transform: uppercase; color: var(--ouro); margin-bottom: 1.25rem; }
    h1 { font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.15; margin-bottom: 1.25rem; }
    h1 em { color: var(--ouro); }
    p { color: var(--text-secondary); line-height: 1.7; margin-bottom: 2.5rem; }
    .links { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
    .btn { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; padding: 1rem 1.75rem; border-radius: 2px; text-decoration: none; border: 1px solid var(--ouro); color: var(--ouro); }
    .btn.primario { background: var(--ouro); color: var(--petroleo-dark); }
    .btn:hover { background: var(--ouro-light); color: var(--petroleo-dark); }
  </style>
</head>
<body>
  <header><a href="/" class="logo">Reginaldo <span>Negocia</span></a></header>
  <main>
    <div class="box">
      <p class="eyebrow">Erro 404</p>
      <h1>Essa página não está na mesa. <em>Mas o resto está.</em></h1>
      <p>O endereço pode ter mudado ou foi digitado errado. Escolha por onde seguir:</p>
      <div class="links">
        <a class="btn primario" href="/">Início</a>
        <a class="btn" href="/prep-ia.html">Prep Estratégico</a>
        <a class="btn" href="/kit.html">Kit gratuito</a>
        <a class="btn" href="/para-empresas.html">Para empresas</a>
      </div>
    </div>
  </main>
</body>
</html>
